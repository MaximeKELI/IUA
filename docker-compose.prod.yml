# Production-oriented stack — does NOT auto-seed demo data.
# Usage:
#   cp backend/.env.prod.example backend/.env.prod   # fill secrets
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: iua_campus
      POSTGRES_USER: iua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iua -d iua_campus"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port publish — internal network only

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://iua:${POSTGRES_PASSWORD}@db:5432/iua_campus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://iua:${POSTGRES_PASSWORD}@db:5432/iua_campus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l warning

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://iua:${POSTGRES_PASSWORD}@db:5432/iua_campus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l warning

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm run build && npm start"

volumes:
  pgdata_prod:
