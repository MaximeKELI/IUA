name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          USE_SQLITE_FOR_LOCAL: "true"
          DJANGO_SECRET_KEY: ci-test-secret-not-for-production
        run: pytest -q --tb=short
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block obvious secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
            --exclude='*.md' --exclude='*example*' \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[0-9A-Za-z-]{10,})' . ; then
            echo "Possible secrets found"; exit 1
          fi
          echo "No high-confidence secret patterns"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_COOKIE_ONLY_AUTH: "true"
          NEXT_PUBLIC_DEMO_LOGIN: "false"
        run: npm run build
