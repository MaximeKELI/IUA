# Reverse proxy skeleton for production / staging
upstream iua_backend {
    server backend:8000;
}

upstream iua_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name campus.iua.local;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://iua_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://iua_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://iua_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
